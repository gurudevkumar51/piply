version: "1"
title: ECW Data Pipeline Example
workspace: .

secrets:
  backend: env
  prefix: PIPLY_SECRET_

connections:
  warehouse: ${secret:WAREHOUSE_DSN}

pipelines:
  ecw_data_pipeline:
    title: ECW Data Pipeline
    description: Multi-step ETL example with parallel extracts, validation, load, and notification.
    schedule:
      cron: "0 2 * * *"
      timezone: UTC
    retry:
      attempts: 1
      mode: resume
      delay_seconds: 60
    max_parallel_tasks: 3
    tags: [ecw, etl]
    sensors:
      warehouse_rows:
        type: sql_sensor
        connection_ref: warehouse
        table: inbound_events
        cursor_column: id
        ignore_existing: true
    tasks:
      extract_appointments:
        type: python
        module: pipelines.extract_appointments
        function: main

      extract_patients:
        type: python
        module: pipelines.extract_patients
        function: main

      transform_data:
        type: cli
        command: python pipelines/transform.py
        depends_on: [extract_appointments, extract_patients]

      validate_data:
        type: cli
        command: dbt test --select tag:validation
        depends_on: [transform_data]

      load_to_warehouse:
        type: cli
        command: dbt run --select staging intermediate marts
        depends_on: [validate_data]

      send_report:
        type: python
        module: pipelines.report
        function: send_completion_report
        depends_on: [load_to_warehouse]
        on_upstream_failure: fail
