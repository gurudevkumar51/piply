<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Piply{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/dag.js" defer></script>
    <script src="/static/app.js" defer></script>
</head>
<body>
    <div class="app-shell">
        <nav class="topbar">
            <a class="brand" href="/">
                <span class="brand-mark">pl</span>
                <span class="brand-text">
                    <span class="brand-name">Piply</span>
                    <span class="brand-subtitle">{{ project.title }}</span>
                </span>
            </a>

            <div class="nav-links">
                <a class="nav-link {% if page == 'dashboard' %}active{% endif %}" href="/">Dashboard</a>
                <a class="nav-link {% if page == 'pipelines' %}active{% endif %}" href="/pipelines">Pipelines</a>
                <a class="nav-link {% if page == 'runs' %}active{% endif %}" href="/runs">Runs</a>
                <a class="nav-link {% if page == 'matrix' %}active{% endif %}" href="/execution-matrix">Grid</a>
                <a class="nav-link {% if page == 'logs' %}active{% endif %}" href="/logs">Logs</a>
                <a class="nav-link {% if page == 'diagnostics' %}active{% endif %}" href="/diagnostics">Diagnostics</a>
                <a class="nav-link {% if page == 'settings' %}active{% endif %}" href="/settings">Settings</a>
            </div>

            <div
                class="scheduler-chip {{ scheduler.state or ('running' if scheduler.running else 'stopped') }}"
                data-scheduler-chip
                title="Config: {{ scheduler.config_path }}"
            >
                <span class="status-dot"></span>
                <span data-scheduler-label>{{ scheduler.label or ('scheduler live' if scheduler.running else 'scheduler offline') }}</span>
            </div>

            <a href="/logout" class="button ghost" style="padding: 6px 12px; font-size: 0.85rem;">Logout</a>
        </nav>

        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const chip = document.querySelector("[data-scheduler-chip]");
        const label = document.querySelector("[data-scheduler-label]");
        if (!chip || !label || typeof piplyRequest !== "function") {
            return;
        }

        const renderScheduler = (payload) => {
            const state = payload.state || (payload.running ? "running" : "stopped");
            chip.className = `scheduler-chip ${state}`;
            label.textContent = payload.label || (payload.running ? "scheduler live" : "scheduler offline");
            const detail = payload.last_error ? ` | ${payload.last_error}` : "";
            chip.title = `Config: ${payload.config_path}${detail}`;
        };

        const refreshScheduler = async () => {
            try {
                const payload = await piplyRequest("/api/dashboard/scheduler");
                renderScheduler(payload);
            } catch (error) {
                chip.className = "scheduler-chip stale";
                label.textContent = "scheduler offline";
            }
        };

        window.setInterval(refreshScheduler, 5000);
    });
    </script>
</body>
</html>
