name: PR Validation

on:
  pull_request:
    branches:
      - main
      - staging

jobs:
  validate:
    runs-on: linux_amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pre-commit
        run: |
          pre-commit run --all-files --show-diff-on-failure
