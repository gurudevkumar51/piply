name: PR Validation

on:
  push:
    branches:
      - "codex/**"
  pull_request:
    branches:
      - main
      - staging

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Verify matrix environment
        env:
          EXPECTED_RUNNER: ${{ matrix.os }}
          EXPECTED_PYTHON: ${{ matrix.python }}
        run: python -I -c "import os,platform,sys; expected={'ubuntu-latest':'Linux','windows-latest':'Windows'}[os.environ['EXPECTED_RUNNER']]; assert platform.system()==expected, (platform.system(),expected); assert '.'.join(map(str,sys.version_info[:2]))==os.environ['EXPECTED_PYTHON']; print(platform.platform(),sys.version)"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]" "ruff==0.15.4"

      - name: Lint and format
        run: |
          python -m ruff check piply tests tools
          python -m ruff format --check piply tests tools

      - name: Regression tests
        run: python -m pytest -q

  postgres:
    runs-on: ubuntu-latest
    container: ghcr.io/catthehacker/ubuntu:act-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: piply
          POSTGRES_PASSWORD: piply-ci-only
          POSTGRES_DB: piply_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U piply -d piply_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[test,postgres]"
      - name: PostgreSQL parity
        env:
          PIPLY_TEST_POSTGRES_DSN: postgresql://piply:piply-ci-only@postgres:5432/piply_test
          PIPLY_TEST_POSTGRES_RESET: "1"
        run: python -m pytest -q tests/test_postgres_store.py
