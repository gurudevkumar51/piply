name: Piply Release

on:
  push:
    tags:
      - "v*"


jobs:

  build-and-publish:
    runs-on: linux_amd64

    permissions:
      contents: read

    steps:

      # -------------------------
      # Checkout
      # -------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------
      # Python Setup
      # -------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # -------------------------
      # Upgrade pip
      # -------------------------

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      # -------------------------
      # Install package
      # -------------------------

      - name: Install dependencies
        run: |
          pip install -e ".[dev,test,build]"

      # -------------------------
      # Lint
      # -------------------------

      - name: Run lint
        run: |
          ruff check .
          ruff format --check .

      # -------------------------
      # Run tests
      # -------------------------

      - name: Run tests
        run: |
          pytest

      # -------------------------
      # Build package
      # -------------------------

      - name: Build package
        run: |
          python -m build

      # -------------------------
      # Validate package
      # -------------------------

      - name: Validate package
        run: |
          twine check dist/*

      # -------------------------
      # Upload artifacts
      # -------------------------

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: piply-dist
          path: dist/

      # -------------------------
      # Publish to PyPI
      # -------------------------

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/*
