name: PIPLY CI/CD (Python → Build → PyPI)

on:
  push:
    tags:
      - "v*"

    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"

jobs:
  build-and-publish:
    runs-on: linux_amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run lint
        run: |
          black --check .
          isort --check-only .
          ruff check .

      - name: Run tests
        run: |
          pytest

      - name: Install build tools
        run: |
          pip install build twine

      - name: Build Python package
        run: |
          python -m build
      
      - name: Publish to Public PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/*
